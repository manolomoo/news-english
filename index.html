<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新聞英文-貴婦養成之路</title><style>
:root{--bg:#f6f7fb;--fg:#1b1d24;--mu:#6b7080;--cd:#fff;--ln:#e3e5ec;--ac:#2f6fed;--bad:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#121318;--fg:#eceef4;--mu:#9aa0b0;--cd:#1d1f27;--ln:#2c2f3a;--ac:#6ea0ff;--bad:#ff7a7a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-bottom:70px}
.w{max-width:560px;margin:0 auto;padding:28px 16px 40px}h1{font-size:28px;margin:0 0 6px}.sub{color:var(--mu);font-size:16px;margin:0 0 22px;line-height:1.5}
a.card,.card{display:block;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:20px;margin-bottom:14px;color:inherit;text-decoration:none;min-height:88px}
a.card:active{transform:scale(.98)}.t{display:flex;justify-content:space-between;align-items:center}.wk{font-size:22px;font-weight:800}.s{color:var(--mu);margin-top:10px;font-size:16px}.go{color:var(--ac);margin-top:10px;font-weight:600}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}.mu{color:var(--mu)}.b{flex:1 1 110px;padding:12px;font-size:17px;border-radius:10px;border:1px solid var(--ln);background:var(--cd);color:var(--fg);font-weight:600}.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.mw-pop{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:600px;margin:0 auto;background:var(--cd);color:var(--fg);border:1px solid var(--ln);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.22);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.mw-ph{display:flex;align-items:center;gap:8px}.mw-w{flex:1;min-width:0;font-size:24px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.mw-sp,.mw-x{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);color:var(--fg);font-size:20px;-webkit-tap-highlight-color:transparent}
.mw-sub{font-size:13px;color:var(--mu);min-height:17px}
.mw-in{width:100%;padding:12px;font-size:18px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--fg)}
.mw-ps{font-size:14px;line-height:1.55;color:var(--mu);max-height:4.7em;overflow:auto}.mw-ps b,.mw-is b{color:var(--ac)}
.mw-ok{flex:none;min-height:50px;font-size:18px}
.mw-toast{display:none;position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99;background:#222;color:#fff;border-radius:999px;padding:10px 18px;font-size:15px;max-width:90vw;overflow-wrap:anywhere}
.mw-panel{position:fixed;inset:0;z-index:98;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.mw-pin{max-width:600px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:10px}
.mw-pb{display:flex;align-items:center;justify-content:space-between;font-size:20px}.mw-pb .b{flex:none;padding:10px 18px}
.mw-hd2{display:flex;align-items:center;justify-content:space-between;font-size:18px}
.mw-list{display:flex;flex-direction:column;gap:10px}
.mw-it{border:1px solid var(--ln);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.mw-r1{display:flex;align-items:center;justify-content:space-between;gap:8px}.mw-iw{font-size:20px;font-weight:800;overflow-wrap:anywhere}
.mw-it .mw-sp{width:44px;height:44px;font-size:18px}
.mw-zh{font-size:17px;color:var(--ac);font-weight:650;overflow-wrap:anywhere}.mw-is{font-size:14px;line-height:1.55;color:var(--mu);overflow-wrap:anywhere}
.mw-r3{display:flex;align-items:center;justify-content:space-between;gap:8px}.mw-ls{font-size:13px;color:var(--ac);text-decoration:none}
.mw-del{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--ln);background:var(--cd);color:var(--bad);font-size:15px;font-weight:650}
.mw-empty{font-size:15px;line-height:1.6}.mw-cr{font-size:12px;color:var(--mu)}
</style></head><body><div class="w"><h1 style="margin-top:12px">新聞英文-貴婦養成之路</h1><p class="sub">每週一個單元（附日期）｜單字 → 課文 → 其他｜自然語音＋回音法：先聽、心裡回音、再大聲跟讀</p><div id="srs-home"></div><div id="rpgc"></div><div id="list"></div><div id="mywc" style="margin-top:14px"></div></div>
<script>window.PAGEVER="25"</script><script src="rw.js?v=25"></script><script src="rpg.js?v=25"></script><script src="srs.js?v=25"></script><script src="mywords.js?v=25"></script><script>MW.home(document.getElementById("mywc"));RW.home(document.getElementById("list"));RPG.home(document.getElementById("rpgc"));SRS.home(document.getElementById("srs-home"))</script></body></html>
